services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: farmora
      POSTGRES_PASSWORD: farmora
      POSTGRES_DB: farmora
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  pgdata: